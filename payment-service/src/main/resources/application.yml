spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/payments}
    username: ${DB_USERNAME:payment_user}
    password: ${DB_PASSWORD:payment_password}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: payment-service
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: "com.lylecommerce.payment.messaging"
        spring.json.value.default.type: "com.lylecommerce.payment.messaging.InventoryReservedEvent"
        spring.json.use.type.headers: false
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
server:
  port: 8083
management:
  endpoints:
    web:
      exposure:
        include: health,info


payment:
  simulation:
    outcome: ${PAYMENT_SIMULATION_OUTCOME:AUTO}
    force-failure: ${DEMO_PAYMENT_FORCE_FAILURE:false}
