services:

  order-db:
    restart: unless-stopped
    image: postgres:17
    container_name: commerce-order-db
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_password
    ports:
      - "5433:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_user -d orders"]
      interval: 5s
      timeout: 5s
      retries: 5

  inventory-db:
    restart: unless-stopped
    image: postgres:17
    container_name: commerce-inventory-db
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: inventory_password
    ports:
      - "5434:5432"
    volumes:
      - inventory-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U inventory_user -d inventory" ]
      interval: 5s
      timeout: 5s
      retries: 5

  payment-db:
    restart: unless-stopped
    image: postgres:17
    container_name: commerce-payment-db
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: payment_password
    ports:
      - "5435:5432"
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_user -d payments"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    restart: unless-stopped
    image: apache/kafka:4.1.0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    container_name: commerce-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://order-db:5432/orders
      DB_USERNAME: order_user
      DB_PASSWORD: order_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports:
      - "8081:8081"
    depends_on:
      order-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://inventory-db:5432/inventory
      DB_USERNAME: inventory_user
      DB_PASSWORD: inventory_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports:
      - "8082:8082"
    depends_on:
      inventory-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://payment-db:5432/payments
      DB_USERNAME: payment_user
      DB_PASSWORD: payment_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      PAYMENT_SIMULATION_OUTCOME: ${PAYMENT_SIMULATION_OUTCOME:-AUTO}
      DEMO_PAYMENT_FORCE_FAILURE: ${DEMO_PAYMENT_FORCE_FAILURE:-false}
    ports:
      - "8083:8083"
    depends_on:
      payment-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      order-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy

volumes:
  kafka-data:
  order-db-data:
  payment-db-data:
  inventory-db-data:
